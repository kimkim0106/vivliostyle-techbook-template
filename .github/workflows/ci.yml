name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - run: npm ci
      - run: npm run cspell
      - run: npm run textlint
      # Run press-ready as the runner user to avoid Docker bind-mount permissions.
      - name: Install PDF processing tools
        run: sudo apt-get update && sudo apt-get install -y ghostscript poppler-utils
      - run: npm run build:web
      - name: Build press-ready PDF
        run: npx vivliostyle build -o output-press.pdf --preflight press-ready-local --crop-marks
      - name: Verify generated PDFs
        run: |
          for pdf in output-web.pdf output-press.pdf; do
            test -s "$pdf"
            pdfinfo "$pdf"
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: pdf
          path: |
            output-web.pdf
            output-press.pdf
          retention-days: 7
          if-no-files-found: error
